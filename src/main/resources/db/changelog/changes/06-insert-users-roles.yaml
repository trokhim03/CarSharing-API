databaseChangeLog:
  - changeSet:
      id: insert-users-roles
      author: trokhim
      changes:
        - insert:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  valueComputed: (SELECT id FROM users WHERE email = 'manager@example.com')
              - column:
                  name: role_id
                  value: 2
        - insert:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  valueComputed: (SELECT id FROM users WHERE email = 'customer@example.com')
              - column:
                  name: role_id
                  value: 1